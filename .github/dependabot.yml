version: 2

updates:
  # pnpm workspace: Dependabot reads the root pnpm-lock.yaml and updates every
  # workspace package (packages/*, examples/*) from this single entry.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      rescript:
        patterns:
          - rescript
          - "@rescript/*"
      tauri:
        patterns:
          - "@tauri-apps/*"
          - tauri
      biome:
        patterns:
          - "@biomejs/*"

  # Cargo workspace at the repository root (examples/*/src-tauri members).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      tauri-crates:
        patterns:
          - "tauri*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
