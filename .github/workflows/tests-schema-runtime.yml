name: tests-schema-runtime

on:
  push:
    branches: [main]
    paths:
      - "packages/schema/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/tests-schema-runtime.yml"
      - ".github/workflows/_test-package-runtime.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/schema/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/_test-package-runtime.yml"

jobs:
  call:
    uses: ./.github/workflows/_test-package-runtime.yml
    with:
      package-name: "@rescript-tauri/schema"
