name: build-core

on:
  push:
    branches: [main]
    paths:
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/build-core.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "package.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean build
        run: pnpm --filter @rescript-tauri/core run clean
      - name: Build with timing
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          pnpm --filter @rescript-tauri/core build
          end=$(date +%s)
          duration=$((end - start))
          echo "::notice::Clean build completed in ${duration}s (PRD §5.2 budget: 30s)"
          if [ "$duration" -gt 60 ]; then
            echo "::warning::Clean build exceeded twice the PRD budget (${duration}s > 60s)"
          fi
