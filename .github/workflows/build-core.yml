name: build-core

on:
  push:
    branches: [main]
    paths:
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/build-core.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "package.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean build
        run: pnpm --filter @rescript-tauri/core run clean
      - name: Build with timing
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          pnpm --filter @rescript-tauri/core build
          end=$(date +%s)
          duration=$((end - start))
          echo "::notice::Clean build completed in ${duration}s (PRD §5.2 budget: 30s)"
          if [ "$duration" -gt 60 ]; then
            echo "::warning::Clean build exceeded twice the PRD budget (${duration}s > 60s)"
          fi
