name: tests-coverage

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/tests-coverage.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/tests-coverage.yml"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - core
          - plugin-fs
          - plugin-dialog
          - plugin-shell
          - plugin-notification
          - plugin-log
          - plugin-os
          - plugin-clipboard-manager
          - plugin-http
          - schema
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run coverage
        run: pnpm --filter @rescript-tauri/${{ matrix.package }} test:coverage
      - name: Write coverage summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary="packages/${{ matrix.package }}/coverage/coverage-summary.json"
          if [ ! -f "$summary" ]; then
            echo "::warning::No coverage-summary.json for ${{ matrix.package }} — tests may have failed before coverage report was written"
            exit 0
          fi
          {
            echo "## Coverage: @rescript-tauri/${{ matrix.package }}"
            echo ""
            echo "| Metric | % | Covered / Total |"
            echo "|---|---|---|"
            jq -r '
              .total |
              to_entries[] |
              select(.key=="lines" or .key=="statements" or .key=="branches" or .key=="functions") |
              "| \(.key) | \(.value.pct)% | \(.value.covered) / \(.value.total) |"
            ' "$summary"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/
          retention-days: 30
          if-no-files-found: warn
