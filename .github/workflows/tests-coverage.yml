name: tests-coverage

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/tests-coverage.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/tests-coverage.yml"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - core
          - plugin-fs
          - plugin-dialog
          - plugin-shell
          - plugin-notification
          - plugin-log
          - plugin-os
          - plugin-clipboard-manager
          - plugin-http
          - schema
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run coverage
        run: pnpm --filter @rescript-tauri/${{ matrix.package }} test:coverage
      - name: Write coverage summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary="packages/${{ matrix.package }}/coverage/coverage-summary.json"
          if [ ! -f "$summary" ]; then
            echo "::warning::No coverage-summary.json for ${{ matrix.package }} — tests may have failed before coverage report was written"
            exit 0
          fi
          {
            echo "## Coverage: @rescript-tauri/${{ matrix.package }}"
            echo ""
            echo "| Metric | % | Covered / Total |"
            echo "|---|---|---|"
            jq -r '
              .total |
              to_entries[] |
              select(.key=="lines" or .key=="statements" or .key=="branches" or .key=="functions") |
              "| \(.key) | \(.value.pct)% | \(.value.covered) / \(.value.total) |"
            ' "$summary"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/
          retention-days: 30
          if-no-files-found: warn
