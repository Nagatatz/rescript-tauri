name: tests-coverage

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/tests-coverage.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/tests-coverage.yml"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - core
          - plugin-fs
          - plugin-dialog
          - plugin-shell
          - plugin-notification
          - schema
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run coverage
        run: pnpm --filter @rescript-tauri/${{ matrix.package }} test:coverage
      - name: Write coverage summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary="packages/${{ matrix.package }}/coverage/coverage-summary.json"
          if [ ! -f "$summary" ]; then
            echo "::warning::No coverage-summary.json for ${{ matrix.package }} — tests may have failed before coverage report was written"
            exit 0
          fi
          {
            echo "## Coverage: @rescript-tauri/${{ matrix.package }}"
            echo ""
            echo "| Metric | % | Covered / Total |"
            echo "|---|---|---|"
            jq -r '
              .total |
              to_entries[] |
              select(.key=="lines" or .key=="statements" or .key=="branches" or .key=="functions") |
              "| \(.key) | \(.value.pct)% | \(.value.covered) / \(.value.total) |"
            ' "$summary"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/
          retention-days: 30
          if-no-files-found: warn
