name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only — skip npm publish even if NPM_TOKEN is set"
        required: false
        default: "true"

permissions:
  # `id-token: write` is required for npm provenance (--provenance).
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - name: Build @rescript-tauri/core
        run: pnpm --filter @rescript-tauri/core build
      - name: Test @rescript-tauri/core
        run: pnpm --filter @rescript-tauri/core test
      - name: Determine publish mode
        id: mode
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${DRY_RUN_INPUT}" = "true" ]; then
            echo "::notice::workflow_dispatch with dry_run=true — skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${NPM_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN secret not set — skipping publish; configure repo secret to enable"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish @rescript-tauri/core
        if: steps.mode.outputs.publish == 'true'
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --generate-notes --title "$tag"
