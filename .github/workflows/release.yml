name: release

on:
  push:
    tags:
      - "v*"
      - "schema-v*"
      - "plugin-fs-v*"
      - "plugin-dialog-v*"
      - "plugin-shell-v*"
      - "plugin-notification-v*"
      - "plugin-log-v*"
      - "plugin-os-v*"
      - "plugin-clipboard-manager-v*"
      - "plugin-http-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only — skip npm publish"
        required: false
        default: "true"

permissions:
  # `id-token: write` is required for npm Trusted Publishing (OIDC) and
  # `--provenance` attestations. No long-lived NPM_TOKEN is needed; the
  # publish step uses short-lived tokens minted from the OIDC trust
  # configured per-package on npmjs.com.
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - name: Determine target package
        id: target
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # workflow_dispatch (no tag context) defaults to core so existing
          # manual dry-runs keep working unchanged.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "package=@rescript-tauri/core" >> "$GITHUB_OUTPUT"
            echo "directory=packages/core"      >> "$GITHUB_OUTPUT"
            echo "::notice::workflow_dispatch — defaulting to @rescript-tauri/core"
            exit 0
          fi
          tag="${GITHUB_REF#refs/tags/}"
          case "$tag" in
            schema-v*)
              echo "package=@rescript-tauri/schema" >> "$GITHUB_OUTPUT"
              echo "directory=packages/schema"     >> "$GITHUB_OUTPUT"
              ;;
            plugin-fs-v*)
              echo "package=@rescript-tauri/plugin-fs" >> "$GITHUB_OUTPUT"
              echo "directory=packages/plugin-fs"     >> "$GITHUB_OUTPUT"
              ;;
            plugin-dialog-v*)
              echo "package=@rescript-tauri/plugin-dialog" >> "$GITHUB_OUTPUT"
              echo "directory=packages/plugin-dialog"     >> "$GITHUB_OUTPUT"
              ;;
            plugin-shell-v*)
              echo "package=@rescript-tauri/plugin-shell" >> "$GITHUB_OUTPUT"
              echo "directory=packages/plugin-shell"     >> "$GITHUB_OUTPUT"
              ;;
            plugin-notification-v*)
              echo "package=@rescript-tauri/plugin-notification" >> "$GITHUB_OUTPUT"
              echo "directory=packages/plugin-notification"     >> "$GITHUB_OUTPUT"
              ;;
            plugin-log-v*)
              echo "package=@rescript-tauri/plugin-log" >> "$GITHUB_OUTPUT"
              echo "directory=packages/plugin-log"     >> "$GITHUB_OUTPUT"
              ;;
            plugin-os-v*)
              echo "package=@rescript-tauri/plugin-os" >> "$GITHUB_OUTPUT"
              echo "directory=packages/plugin-os"     >> "$GITHUB_OUTPUT"
              ;;
            plugin-clipboard-manager-v*)
              echo "package=@rescript-tauri/plugin-clipboard-manager" >> "$GITHUB_OUTPUT"
              echo "directory=packages/plugin-clipboard-manager"     >> "$GITHUB_OUTPUT"
              ;;
            plugin-http-v*)
              echo "package=@rescript-tauri/plugin-http" >> "$GITHUB_OUTPUT"
              echo "directory=packages/plugin-http"     >> "$GITHUB_OUTPUT"
              ;;
            v*)
              echo "package=@rescript-tauri/core" >> "$GITHUB_OUTPUT"
              echo "directory=packages/core"      >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unrecognized release tag pattern: $tag"
              exit 1
              ;;
          esac
          echo "::notice::Releasing tag $tag"
      - name: Build target package
        run: pnpm --filter ${{ steps.target.outputs.package }} build
      - name: Test target package
        run: pnpm --filter ${{ steps.target.outputs.package }} test
      - name: Determine publish mode
        id: mode
        shell: bash
        env:
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          # Trusted Publishing (OIDC) is configured per-package on npmjs.com,
          # so token presence is no longer a CI-side gate. dry_run skips publish;
          # otherwise the workflow always attempts to publish.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${DRY_RUN_INPUT}" = "true" ]; then
            echo "::notice::workflow_dispatch with dry_run=true — skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish target package
        if: steps.mode.outputs.publish == 'true'
        working-directory: ${{ steps.target.outputs.directory }}
        run: npm publish --provenance --access public
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --generate-notes --title "$tag"
