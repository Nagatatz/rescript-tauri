name: Docs

on:
  push:
    branches: [main]
    paths: ['sphinx-docs/**']
  pull_request:
    branches: [main]
    paths: ['sphinx-docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'push' && 'pages' || format('docs-{0}', github.head_ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sphinx-docs

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        if: hashFiles('sphinx-docs/tests/**/test_*.py', 'sphinx-docs/tests/**/*_test.py') != ''
        run: uv run pytest

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sphinx-docs

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Build site
        run: make build-all
        env:
          SPHINX_SITE_PREFIX: /rescript-tauri

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: sphinx-docs/_build/site

      - name: Link check
        run: make linkcheck
        continue-on-error: true

      - name: Report link check results
        if: always()
        run: |
          if [ -f _build/linkcheck/output.txt ]; then
            {
              echo "## 🔗 Link Check Results"
              echo '```'
              cat _build/linkcheck/output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    if: github.event_name == 'push'
    needs: [lint-and-test, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
