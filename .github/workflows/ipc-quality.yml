name: typed IPC quality

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "tools/check-ipc-mutants.mjs"
      - "tools/formal/**"
      - ".github/workflows/ipc-quality.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run runtime properties and focused mutants
        run: node tools/check-ipc-mutants.mjs
      - name: Verify the IPC model in pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -r -- "$tmp"' EXIT
          curl --fail --silent --show-error --location --max-time 300 \
            'https://github.com/leanprover/lean4/releases/download/v4.23.0/lean-4.23.0-linux.tar.zst' \
            --output "$tmp/lean.tar.zst"
          printf '%s  %s\n' ecd028d6f642b61b451c8687aeeb24dd53789fbfdcb7d4adb8f5cf60eb2022ba "$tmp/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$tmp/lean.tar.zst" -C "$tmp" --strip-components=1
          "$tmp/bin/lean" tools/formal/IpcRouting.lean
