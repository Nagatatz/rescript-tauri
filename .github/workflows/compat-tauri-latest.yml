name: compat-tauri-latest

on:
  schedule:
    # Daily at 06:00 UTC. Catches @tauri-apps/api and @tauri-apps/plugin-*
    # releases early so we can ship compatible @rescript-tauri/* releases in turn.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Override every @tauri-apps/* package with latest
        run: |
          set -euo pipefail
          # Bump @tauri-apps/api, @tauri-apps/cli and every @tauri-apps/plugin-*
          # to the latest stable release in all workspaces (packages/* and
          # examples/*). Plugins release independently of @tauri-apps/api, so
          # overriding the API alone misses plugin-side breakage (e.g. the
          # plugin-notification 2.5.0 IPC rename listChannels -> list_channels).
          pnpm update --recursive --latest "@tauri-apps/*"
      - name: Show installed @tauri-apps versions
        run: pnpm ls --recursive --depth 0 "@tauri-apps/*"
      - name: Build all packages and examples against latest @tauri-apps/*
        run: pnpm --recursive build
      - name: Test all packages against latest @tauri-apps/*
        run: pnpm --recursive test
