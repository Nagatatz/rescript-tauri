name: compat-tauri-latest

on:
  schedule:
    # Daily at 06:00 UTC. Catches @tauri-apps/api minor releases early
    # so we can ship a compatible @rescript-tauri/core minor in turn.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Override @tauri-apps/api with latest
        run: |
          set -euo pipefail
          # Force the latest stable release across every workspace that
          # peer-depends or dev-depends on @tauri-apps/api. --filter "..."
          # walks every package once so monorepo-wide overrides apply.
          pnpm add -w --save-dev @tauri-apps/api@latest
          for pkg in packages/core examples/hello-world examples/window-management examples/ipc-typed examples/streaming-ipc; do
            (cd "$pkg" && pnpm add @tauri-apps/api@latest)
          done
      - name: Show installed @tauri-apps/api versions
        run: pnpm ls --recursive @tauri-apps/api
      - name: Build core against latest @tauri-apps/api
        run: pnpm --filter @rescript-tauri/core build
      - name: Test core against latest @tauri-apps/api
        run: pnpm --filter @rescript-tauri/core test
      - name: Build hello-world example against latest @tauri-apps/api
        run: pnpm --filter hello-world build
