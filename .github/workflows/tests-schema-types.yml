name: tests-schema-types

on:
  push:
    branches: [main]
    paths:
      - "packages/schema/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/tests-schema-types.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/schema/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  type-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (compiles tests/*_signature.res = type-level test)
        run: pnpm --filter @rescript-tauri/schema build
      - name: Public-symbol coverage check
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_COUNT=$(awk '
            BEGIN { in_doc = 0 }
            /^[[:space:]]*\/\*\*/ { in_doc = 1 }
            in_doc && /\*\// { in_doc = 0; next }
            !in_doc && /^[[:space:]]*let [A-Za-z_]/ { count++ }
            END { print count + 0 }
          ' packages/schema/src/*.resi)
          CHECK_COUNT=$(grep -rE '^let _check_' packages/schema/tests --include='*_signature.res' | wc -l | tr -d ' ')
          echo "Public lets in .resi : $PUBLIC_COUNT"
          echo "_check_ refs in tests: $CHECK_COUNT"
          if [ "$CHECK_COUNT" -lt "$PUBLIC_COUNT" ]; then
            echo "::error::Type-level coverage incomplete: $CHECK_COUNT/$PUBLIC_COUNT"
            exit 1
          fi
          echo "::notice::Type-level coverage OK ($CHECK_COUNT/$PUBLIC_COUNT)"
