name: compat-rescript-prerelease

on:
  schedule:
    # Daily at 06:00 UTC. Surfaces ReScript 12.x next-minor / next-major
    # prerelease drift before users hit it (PRD §9 risk: "ReScript 12.x
    # 後続マイナー / 次期メジャーの破壊的変更").
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both dist-tags are checked. If a tag is undefined upstream
        # (e.g. between releases) the pre-flight step skips the job
        # cleanly with exit 0.
        rescript-tag: [next, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Resolve dist-tag for rescript@${{ matrix.rescript-tag }}
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          version=$(npm view rescript@${{ matrix.rescript-tag }} version 2>/dev/null || echo "")
          if [ -z "$version" ]; then
            echo "::warning::dist-tag '${{ matrix.rescript-tag }}' not published; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::resolved rescript@${{ matrix.rescript-tag }} -> $version"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Since ReScript 13.0.0-alpha, the runtime ships as the
          # separately-versioned @rescript/runtime package and the compiler
          # generates `import ... from "@rescript/runtime/lib/es6/..."`.
          # Override the runtime in lockstep so that vitest can resolve the
          # 13.x-only modules (e.g. Stdlib_JsExn). For older rescript versions
          # the dependency is absent and we leave the project's pin in place.
          runtime=$(npm view "rescript@$version" 'dependencies.@rescript/runtime' 2>/dev/null || echo "")
          if [ -n "$runtime" ]; then
            echo "::notice::resolved @rescript/runtime -> $runtime"
            echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm install --frozen-lockfile
        if: steps.resolve.outputs.skip != 'true'
      - name: Override rescript with prerelease
        if: steps.resolve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          pnpm add -w --save-dev rescript@${{ steps.resolve.outputs.version }}
          for pkg in packages/core examples/hello-world examples/window-management examples/ipc-typed examples/streaming-ipc; do
            (cd "$pkg" && pnpm add --save-dev rescript@${{ steps.resolve.outputs.version }})
          done
      - name: Override @rescript/runtime in lockstep
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.runtime != ''
        run: |
          set -euo pipefail
          # Only packages/core declares @rescript/runtime as a devDependency.
          (cd packages/core && pnpm add --save-dev @rescript/runtime@${{ steps.resolve.outputs.runtime }})
      - name: Show installed rescript versions
        if: steps.resolve.outputs.skip != 'true'
        run: pnpm ls --recursive rescript
      - name: Build core against rescript@${{ steps.resolve.outputs.version }}
        if: steps.resolve.outputs.skip != 'true'
        run: pnpm --filter @rescript-tauri/core build
      - name: Test core against rescript@${{ steps.resolve.outputs.version }}
        if: steps.resolve.outputs.skip != 'true'
        run: pnpm --filter @rescript-tauri/core test
