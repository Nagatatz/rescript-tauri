name: compat-rescript

on:
  schedule:
    # Daily check of the published stable release and optional prerelease tags.
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/compat-rescript-prerelease.yml"
      - "tools/resolve-rescript-tag*.mjs"

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rescript-tag: [latest, next, beta, next-12, next-13]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Test the registry-result contract
        run: node --test tools/resolve-rescript-tag.test.mjs
      - name: Resolve ReScript version
        id: resolve
        shell: bash
        env:
          RESCRIPT_TAG: ${{ matrix.rescript-tag }}
        run: |
          set -euo pipefail
          resolved="$(npm view rescript dist-tags --json | node tools/resolve-rescript-tag.mjs "$RESCRIPT_TAG")"
          printf '%s\n' "$resolved" >> "$GITHUB_OUTPUT"
          if [[ "$resolved" == "skip=true" ]]; then
            echo "::notice::dist-tag '$RESCRIPT_TAG' not published; compatibility untested"
            exit 0
          fi
          version="${resolved##*version=}"
          # Read dependency metadata without masking registry errors. On versions
          # without a runtime dependency this returns an empty string.
          runtime="$(npm view "rescript@$version" dependencies --json | node -e '
            const text = require("node:fs").readFileSync(0, "utf8").trim();
            const dep = text ? JSON.parse(text)["@rescript/runtime"] : undefined;
            if (dep != null && (typeof dep !== "string" || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(dep))) process.exit(1);
            process.stdout.write(dep ?? "");
          ')"
          printf 'runtime=%s\n' "$runtime" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
        if: steps.resolve.outputs.skip != 'true'
      - name: Override rescript with the resolved version
        if: steps.resolve.outputs.skip != 'true'
        env:
          RESCRIPT_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          pnpm add -w --save-dev --save-exact "rescript@$RESCRIPT_VERSION"
          for pkg in packages/core examples/hello-world examples/window-management examples/ipc-typed examples/streaming-ipc; do
            (cd "$pkg" && pnpm add --save-dev --save-exact "rescript@$RESCRIPT_VERSION")
          done
      - name: Override @rescript/runtime in lockstep
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.runtime != ''
        env:
          RESCRIPT_RUNTIME: ${{ steps.resolve.outputs.runtime }}
        run: |
          set -euo pipefail
          # Only packages/core declares @rescript/runtime as a devDependency.
          (cd packages/core && pnpm add --save-dev --save-exact "@rescript/runtime@$RESCRIPT_RUNTIME")
      - name: Show installed rescript versions
        if: steps.resolve.outputs.skip != 'true'
        run: pnpm ls --recursive rescript
      - name: Build core against rescript@${{ steps.resolve.outputs.version }}
        if: steps.resolve.outputs.skip != 'true'
        run: pnpm --filter @rescript-tauri/core build
      - name: Test core against rescript@${{ steps.resolve.outputs.version }}
        if: steps.resolve.outputs.skip != 'true'
        run: pnpm --filter @rescript-tauri/core test
