name: examples-build

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "Cargo.toml"
      - ".github/workflows/examples-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "examples/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "Cargo.toml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-09
      - name: Linux Tauri prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - run: pnpm install --frozen-lockfile
      - name: Build hello-world frontend
        run: pnpm --filter hello-world build
      - name: Cargo check on hello-world Rust side
        working-directory: examples/hello-world/src-tauri
        run: cargo check --release --locked
      - name: Build window-management frontend
        run: pnpm --filter window-management build
      - name: Cargo check on window-management Rust side
        working-directory: examples/window-management/src-tauri
        run: cargo check --release --locked
      - name: Build ipc-typed frontend
        run: pnpm --filter ipc-typed build
      - name: Cargo check on ipc-typed Rust side
        working-directory: examples/ipc-typed/src-tauri
        run: cargo check --release --locked
      - name: Build streaming-ipc frontend
        run: pnpm --filter streaming-ipc build
      - name: Cargo check on streaming-ipc Rust side
        working-directory: examples/streaming-ipc/src-tauri
        run: cargo check --release --locked
      - name: Build plugin-dialog-demo frontend
        run: pnpm --filter plugin-dialog-demo build
      - name: Cargo check on plugin-dialog-demo Rust side
        working-directory: examples/plugin-dialog-demo/src-tauri
        run: cargo check --release --locked
      - name: Build plugin-fs-demo frontend
        run: pnpm --filter plugin-fs-demo build
      - name: Cargo check on plugin-fs-demo Rust side
        working-directory: examples/plugin-fs-demo/src-tauri
        run: cargo check --release --locked
      - name: Build plugin-shell-demo frontend
        run: pnpm --filter plugin-shell-demo build
      - name: Cargo check on plugin-shell-demo Rust side
        working-directory: examples/plugin-shell-demo/src-tauri
        run: cargo check --release --locked
      - name: Build plugin-http-demo frontend
        run: pnpm --filter plugin-http-demo build
      - name: Cargo check on plugin-http-demo Rust side
        working-directory: examples/plugin-http-demo/src-tauri
        run: cargo check --release --locked
      - name: Build plugin-clipboard-manager-demo frontend
        run: pnpm --filter plugin-clipboard-manager-demo build
      - name: Cargo check on plugin-clipboard-manager-demo Rust side
        working-directory: examples/plugin-clipboard-manager-demo/src-tauri
        run: cargo check --release --locked
      - name: Build plugin-log-demo frontend
        run: pnpm --filter plugin-log-demo build
      - name: Cargo check on plugin-log-demo Rust side
        working-directory: examples/plugin-log-demo/src-tauri
        run: cargo check --release --locked
      - name: Build plugin-notification-demo frontend
        run: pnpm --filter plugin-notification-demo build
      - name: Cargo check on plugin-notification-demo Rust side
        working-directory: examples/plugin-notification-demo/src-tauri
        run: cargo check --release --locked
      - name: Build plugin-os-demo frontend
        run: pnpm --filter plugin-os-demo build
      - name: Cargo check on plugin-os-demo Rust side
        working-directory: examples/plugin-os-demo/src-tauri
        run: cargo check --release --locked
      - name: Build ipc-typed-with-schema frontend
        run: pnpm --filter ipc-typed-with-schema build
      - name: Cargo check on ipc-typed-with-schema Rust side
        working-directory: examples/ipc-typed-with-schema/src-tauri
        run: cargo check --release --locked
