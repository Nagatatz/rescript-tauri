name: examples-build

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/examples-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "examples/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-09
      - name: Linux Tauri prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - run: pnpm install --frozen-lockfile
      - name: Build hello-world frontend
        run: pnpm --filter hello-world build
      - name: Cargo check on hello-world Rust side
        working-directory: examples/hello-world/src-tauri
        run: cargo check --release
      - name: Build window-management frontend
        run: pnpm --filter window-management build
      - name: Cargo check on window-management Rust side
        working-directory: examples/window-management/src-tauri
        run: cargo check --release
      - name: Build ipc-typed frontend
        run: pnpm --filter ipc-typed build
      - name: Cargo check on ipc-typed Rust side
        working-directory: examples/ipc-typed/src-tauri
        run: cargo check --release
      - name: Build streaming-ipc frontend
        run: pnpm --filter streaming-ipc build
      - name: Cargo check on streaming-ipc Rust side
        working-directory: examples/streaming-ipc/src-tauri
        run: cargo check --release
